name: validate
on:
  push:
    branches:
      - main
jobs:
  validate-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: check file exists
        run: |
          if [ -f "sample.txt" ]; then
            echo "file exists"
          else
            echo "file does not exist"
            exit 1
          fi
        